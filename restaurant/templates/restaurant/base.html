{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Little Lemon{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'restaurant/css/style.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'home' %}" aria-label="Little Lemon home">
      <span class="brand-mark">LL</span>
      <span>Little Lemon</span>
    </a>
    <nav aria-label="Main navigation">
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'booking' %}">Book a table</a>
    </nav>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer>
    <span class="brand-mark small">LL</span>
    <p>Little Lemon · Chicago</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
